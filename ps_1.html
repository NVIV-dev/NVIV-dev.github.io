<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, viewport-fit=cover">
    <title>Travesía Al Abismo</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #FFF; font-family: sans-serif; font-size: 15px; }
      #app { position: relative; width: 100%; height: 100vh; height: 100dvh; }
      .screen { position: absolute; inset: 0; width: 100%; height: 100%; }
      #coverWrapper { display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
      #cover { width: 80%; height: 80%; background: url("https://lh3.googleusercontent.com/d/1LI3Ua4N-Ew2VFkb2yC8OP5zWkn7zqLk6=s2000") center / contain no-repeat; }
      button { border: none; background: transparent; color: #000; font-family: inherit; font-weight: bold; cursor: pointer; }
      #activar { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 0.8em 2em; border-radius: 2em; background: #000; color: #FFF; font-size: 1em; }
      button:disabled { opacity: 0.6; cursor: wait; }
      #segunda { display: none; cursor: pointer; touch-action: manipulation; }
      #imagenContenedor { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
      #imagenContenedor img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 8px; user-select: none; }
      #pila { display: none; }
      #musicBtn { position: fixed; right: 20px; bottom: 20px; z-index: 9; width: 50px; height: 50px; font-size: 30px; }
      #musicBtn[hidden] { display: none; }
      #ytplayer { position: absolute; width: 200px; height: 200px; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="inicio" class="screen">
        <div id="coverWrapper"><div id="cover"></div></div>
        <button id="activar" type="button">Reflexionar</button>
      </div>
      <div id="segunda" class="screen"><div id="imagenContenedor"></div></div>
      <div id="pila">
        <img src="https://lh3.googleusercontent.com/d/1Q-Cvw1MqMCNW4N3FIql8GD9FR29LGCS7=s2000" alt="01">
        <img src="https://lh3.googleusercontent.com/d/1iVnkaJ9xDrcBp5dIOIAsXoXQdnhMzYft=s2000" alt="02.1">
        <img src="https://lh3.googleusercontent.com/d/1xMTwQ8cZjf0a-SUtJUaUJybVvE1usPdf=s2000" alt="02.2">
        <img src="https://lh3.googleusercontent.com/d/1QU9iStw3GMBoomv8CeeQJElEjdsgXrgT=s2000" alt="03.1">
        <img src="https://lh3.googleusercontent.com/d/1d0wnAwucctrOs0LPVQblpnW065oPkgte=s2000" alt="03.2">
        <img src="https://lh3.googleusercontent.com/d/1FsWd9mI_8RDXrdxenGNKcg4pgYYmORkA=s2000" alt="04">
        <img src="https://lh3.googleusercontent.com/d/12B5HVeFpAdzj82MGSeT_2qyVVzGJqNP4=s2000" alt="05.1">
        <img src="https://lh3.googleusercontent.com/d/15FDKY2RlYZqtwyEakujtHD98CoUIKPaw=s2000" alt="05.2">
        <img src="https://lh3.googleusercontent.com/d/1qHPD5UmS5BNO941DBTy3daQPOUdpgnXe=s2000" alt="06">
        <img src="https://lh3.googleusercontent.com/d/1RgLgbfznynW7wwaTeiGW6ZrN-8FbtulY=s2000" alt="07">
      </div>
    </div>
    <button id="musicBtn" type="button" aria-label="Pausar música" hidden>⏸️</button>
    <div id="ytplayer"></div>
    <script>
      let player;
      let playerListo = false;
      let iniciado = false;
      let musicaActiva = false;
      const musicBtn = document.getElementById("musicBtn");
      let animando = false;
      let ultimaImagen = null;
      let imagenes = [];
      const boton = document.getElementById("activar");
      const inicio = document.getElementById("inicio");
      const segunda = document.getElementById("segunda");
      const contenedor = document.getElementById("imagenContenedor");
      boton.disabled = true;
      boton.textContent = "Cargando...";
      const cargas = Array.from(document.querySelectorAll("#pila img")).map(imagen => {
        return new Promise(resolve => {
          if (imagen.complete) {
            resolve(imagen.naturalWidth > 0 ? imagen : null);
            return;
          }
          imagen.onload = () => resolve(imagen);
          imagen.onerror = () => resolve(null);
        });
      });
      Promise.all(cargas).then(resultados => {
        imagenes = resultados.filter(Boolean);
        boton.disabled = imagenes.length === 0;
        boton.textContent = imagenes.length ? "Reflexionar" : "No cargaron las imágenes";
      });
      function onYouTubeIframeAPIReady() {
        player = new YT.Player("ytplayer", {
          playerVars: {
            listType: "playlist",
            list: "PLTsg_kaNc_Za3jQ2MdxDYGebDrL1NMcrj",
            autoplay: 0,
            controls: 0,
            playsinline: 1,
            rel: 0,
            loop: 1
          },
          events: {
            onReady: function() {
              playerListo = true;
              player.setVolume(50);
              if (iniciado && musicaActiva) reproducirPlaylist();
            }
          }
        });
      }
      function reproducirPlaylist() {
        if (!playerListo || !musicaActiva) return;
        player.setVolume(50);
        player.unMute();
        player.playVideo();
        musicBtn.textContent = "⏸️";
        musicBtn.setAttribute("aria-label", "Pausar música");
      }
      function mostrarImagen(imagen) {
        const copia = imagen.cloneNode();
        copia.draggable = false;
        contenedor.replaceChildren(copia);
      }
      function efectoAleatorio() {
        if (animando || !imagenes.length) return;
        animando = true;
        const orden = [...imagenes];
        for (let i = orden.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [orden[i], orden[j]] = [orden[j], orden[i]];
        }
        let paso = 0;
        mostrarImagen(orden[paso++]);
        const intervalo = setInterval(function() {
          mostrarImagen(orden[paso++ % orden.length]);
        }, 60);
        setTimeout(function() {
          clearInterval(intervalo);
          const opciones = imagenes.filter(imagen => imagen !== ultimaImagen);
          ultimaImagen = opciones.length
            ? opciones[Math.floor(Math.random() * opciones.length)]
            : imagenes[0];
          mostrarImagen(ultimaImagen);
          animando = false;
        }, 3000);
      }
      boton.addEventListener("click", function() {
        iniciado = true;
        musicaActiva = true;
        musicBtn.hidden = false;
        inicio.style.display = "none";
        segunda.style.display = "block";
        reproducirPlaylist();
        efectoAleatorio();
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(function() {});
        }
      });
      segunda.addEventListener("click", function() {
        reproducirPlaylist();
        efectoAleatorio();
      });
      musicBtn.addEventListener("click", function() {
        musicaActiva = !musicaActiva;
        if (musicaActiva) {
          reproducirPlaylist();
        } else {
          if (playerListo) player.pauseVideo();
          musicBtn.textContent = "▶️";
          musicBtn.setAttribute("aria-label", "Reproducir música");
        }
      });
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>

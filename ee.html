      html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; font-family: sans-serif; font-size: 1em; }
      body { display: flex; justify-content: center; align-items: center; }
      .pantalla { position: relative; width: 100%; height: 100%; max-width: calc(100vh * 9 / 16); max-height: 100vh; aspect-ratio: 9 / 16; overflow: hidden; }
      .inicio { display: flex; justify-content: center; align-items: flex-end; padding: 2em; box-sizing: border-box; background: url('https://lh3.googleusercontent.com/d/19tZOoCzUQJGHzZ-UL4JbCtzrBZYcIP8W=s3000') center / cover; }
      button { width: 50%; padding: 0.8em 2em; border: none; border-radius: 2em; background: #000; color: #FFF; font-size: 1em; cursor: pointer; }
      button:active { transform: scale(0.95); }
      button:disabled { opacity: 0.6; cursor: wait; }
      .segunda { display: none; background: url('https://lh3.googleusercontent.com/d/19bNmfCTPtlVyxAAesrrdEEPkx1sMDIpp=s2000') center / cover; cursor: pointer; touch-action: manipulation; }

      .imagen-contenedor { position: absolute; inset: 0; z-index: 1; display: flex; justify-content: center; align-items: center; }
      .imagen-contenedor img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; }
      .pila { display: none; }
      .footer { position: fixed; right: 0; bottom: 0.5rem; left: 0; z-index: 9; color: #DDD; font-size: 0.5rem; text-align: center; pointer-events: none; }

    <script>
      let player;
      let playerListo = false;
      let iniciado = false;
      let animando = false;
      let ultimaImagen = null;
      let imagenes = [];
      const boton = document.getElementById("activar");
      const inicio = document.getElementById("inicio");
      const segunda = document.getElementById("segunda");
      const contenedor = document.getElementById("imagenContenedor");
      boton.disabled = true;
      boton.textContent = "Cargando...";
      const cargas = Array.from(document.querySelectorAll("#pila img")).map(imagen => {
        return new Promise(resolve => {
          if (imagen.complete) {
            resolve(imagen.naturalWidth > 0 ? imagen : null);
            return;
          }
          imagen.onload = () => resolve(imagen);
          imagen.onerror = () => resolve(null);
        });
      });
      Promise.all(cargas).then(resultados => {
        imagenes = resultados.filter(Boolean);
        boton.disabled = imagenes.length === 0;
        boton.textContent = imagenes.length ? "Reflexionar" : "No cargaron las imágenes";
      });
      function onYouTubeIframeAPIReady() {
        player = new YT.Player("ytplayer", {
          playerVars: {
            listType: "playlist",
            list: "PLTsg_kaNc_ZbIrQvOPmRepLoqmW7ZSnf0",
            autoplay: 0,
            controls: 0,
            playsinline: 1,
            rel: 0
          },
          events: {
            onReady: function() {
              playerListo = true;
              player.setVolume(50);
              if (iniciado) reproducirPlaylist();
            }
          }
        });
      }
      function reproducirPlaylist() {
        if (!playerListo) return;
        player.setVolume(50);
        player.unMute();
        player.playVideo();
      }
      function mostrarImagen(imagen) {
        const copia = imagen.cloneNode();
        copia.draggable = false;
        contenedor.replaceChildren(copia);
      }
      function efectoAleatorio() {
        if (animando || !imagenes.length) return;
        animando = true;
        const orden = [...imagenes];
        for (let i = orden.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [orden[i], orden[j]] = [orden[j], orden[i]];
        }
        let paso = 0;
        mostrarImagen(orden[paso++]);
        const intervalo = setInterval(function() {
          mostrarImagen(orden[paso++ % orden.length]);
        }, 3000 / orden.length);
        setTimeout(function() {
          clearInterval(intervalo);
          const opciones = imagenes.filter(imagen => imagen !== ultimaImagen);
          ultimaImagen = opciones.length
            ? opciones[Math.floor(Math.random() * opciones.length)]
            : imagenes[0];
          mostrarImagen(ultimaImagen);
          animando = false;
        }, 3000);
      }
      boton.addEventListener("click", function() {
        iniciado = true;
        inicio.style.display = "none";
        segunda.style.display = "block";
        reproducirPlaylist();
        efectoAleatorio();
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(function() {});
        }
      });
      segunda.addEventListener("click", function() {
        reproducirPlaylist();
        efectoAleatorio();
      });
    </script>

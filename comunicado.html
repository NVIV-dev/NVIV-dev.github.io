<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f3efe5">
    <title>Comunicado</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
      html, body { margin:0; width:100%; min-height:100%; }
      body { font-family:Arial, sans-serif; background:linear-gradient(180deg, #0b1d2a 0%, #102a3a 55%, #173a46 100%); background-attachment:fixed; color:#dce9e6; padding:clamp(12px, 3vw, 20px); box-sizing:border-box; min-height:100vh; min-height:100dvh; }
      .topbar { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); display:flex; justify-content:center; flex-wrap:nowrap; gap:10px; z-index:20; }
      .progress-track { position:fixed; left:0; bottom:0; width:100%; height:5px; background:#ff0000; z-index:21; overflow:hidden; }
      .progress-fill { width:0; height:100%; background:#bfff00; transition:width 0.25s linear; }
      .topbar button { border:none; border-radius:10px; padding:8px 14px; cursor:pointer; color:#f2f7f5; transition:0.2s; }  
      #pauseBtn { background:#000000; }
      #restartBtn { background:#000000; }
      #nextBtn { background:#000000; }
      .topbar button:hover { box-shadow:0 0 14px rgba(190,220,214,0.35); transform:scale(1.06); }
      #pauseBtn:hover { box-shadow:none; transform:none; }    
      #stack { padding-bottom:80px; display:flex; flex-direction:column; gap:15px; }
      .content { width:100%; white-space:pre-wrap; word-break:break-word; font-size:45px; text-align:center; line-height:1.55; min-height:calc(100vh - 180px); min-height:calc(100dvh - 180px); outline:none; }
      .paragraph { margin:0 0 1em; }
      .word.highlight { background:#c9b978; color:#13252b; border-radius:4px; box-shadow:0 0 0 2px #c9b978; }  
      @media (max-width:600px) { .topbar button { padding:8px 10px; box-shadow:none !important; transform:none !important; } #pauseBtn { background:#000000; } #restartBtn { background:#000000; } #nextBtn { background:#000000; } #stack { padding-bottom:70px; } }
      html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
      body { padding-top:max(clamp(12px, 3vw, 20px), env(safe-area-inset-top, 0px)); padding-left:max(clamp(12px, 3vw, 20px), env(safe-area-inset-left, 0px)); padding-right:max(clamp(12px, 3vw, 20px), env(safe-area-inset-right, 0px)); }
      .topbar { bottom:calc(12px + env(safe-area-inset-bottom, 0px)); max-width:100%; }
      .topbar button { -webkit-appearance:none; appearance:none; min-width:44px; min-height:44px; font:inherit; font-size:16px; display:inline-flex; align-items:center; justify-content:center; touch-action:manipulation; }
      .topbar button:disabled { opacity:0.45; cursor:default; }
      .topbar button:focus-visible { outline:2px solid #fff; outline-offset:3px; }
      #stack { padding-bottom:calc(80px + env(safe-area-inset-bottom, 0px)); }
      .content { font-size:clamp(32px, 8vw, 45px); overflow-wrap:anywhere; }
      #displayHint { position:fixed; top:calc(12px + env(safe-area-inset-top, 0px)); left:50%; transform:translateX(-50%); width:max-content; max-width:85%; box-sizing:border-box; padding:10px 14px; border-radius:10px; background:#000; color:#fff; font-size:14px; text-align:center; z-index:30; }
      @supports (-webkit-touch-callout:none) { body { background-attachment:scroll; } }
      @media (prefers-reduced-motion:reduce) { *, *::before, *::after { scroll-behavior:auto !important; transition:none !important; } }
      :root { color-scheme:light; --page-bg:#f3efe5; --reading-text:#343a36; --highlight-bg:#ded19e; --highlight-text:#292f29; --track-bg:#d5d2c7; --progress-bg:#687c68; --hint-bg:#e6e1d5; }
      :root[data-theme="night"] { color-scheme:dark; --page-bg:#1c2423; --reading-text:#b9c1b8; --highlight-bg:#495346; --highlight-text:#d5d8c7; --track-bg:#303a35; --progress-bg:#71816c; --hint-bg:#29322e; }
      body { background:var(--page-bg); color:var(--reading-text); }
      .word.highlight { background:var(--highlight-bg); color:var(--highlight-text); box-shadow:0 0 0 2px var(--highlight-bg); }
      .progress-track { background:var(--track-bg); }
      .progress-fill { background:var(--progress-bg); }
      #displayHint { background:var(--hint-bg); color:var(--reading-text); }
      #themeBtn { background:#000000; }
      .topbar button:hover { box-shadow:none; }
      :root[data-theme="night"] .topbar button i { opacity:0.72; }
    </style>
  </head>
  <body>
    <div id="displayHint" role="status" hidden></div>
    <div class="topbar">
      <button id="pauseBtn" aria-label="Pausar"><i aria-hidden="true" class="fa-solid fa-pause" style="color: rgb(255, 255, 255);"></i></button>
      <button id="restartBtn" aria-label="Reiniciar"><i aria-hidden="true" class="fa-solid fa-rotate" style="color: rgb(255, 255, 255);"></i></button>
      <button id="nextBtn" aria-label="Siguiente"><i aria-hidden="true" class="fa-solid fa-forward" style="color: rgb(255, 255, 255);"></i></button>
      <button id="themeBtn" type="button" aria-label="Activar vista nocturna" aria-pressed="false" title="Activar vista nocturna"><i aria-hidden="true" class="fa-solid fa-circle-half-stroke" style="color: rgb(255, 255, 255);"></i></button>
    </div>
    <div class="progress-track" aria-hidden="true">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <div id="stack">
      <div id="lectureText" class="content"></div>
    </div>
    <script>
      const themeBtn = document.getElementById("themeBtn");
      function applyTheme(theme){
        const night = theme === "night";
        document.documentElement.dataset.theme = night ? "night" : "day";
        themeBtn.setAttribute("aria-pressed", String(night));
        const label = night ? "Activar vista diurna" : "Activar vista nocturna";
        themeBtn.setAttribute("aria-label", label);
        themeBtn.title = label;
        document.querySelector('meta[name="theme-color"]').content = night ? "#1c2423" : "#f3efe5";
      }
      let savedTheme = "day";
      try { savedTheme = localStorage.getItem("lector-theme") || "day"; } catch(error) {}
      applyTheme(savedTheme);
      themeBtn.onclick = () => {
        const theme = document.documentElement.dataset.theme === "night" ? "day" : "night";
        applyTheme(theme);
        try { localStorage.setItem("lector-theme", theme); } catch(error) {}
      };
      const pauseBtn = document.getElementById("pauseBtn");
      const restartBtn = document.getElementById("restartBtn");
      const nextBtn = document.getElementById("nextBtn");
      const lectureText = document.getElementById("lectureText");
      const progressFill = document.getElementById("progressFill");
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const speechAvailable = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
      let readingActive = false;
      let hintTimer;
      function showHint(message){
        const hint = document.getElementById("displayHint");
        hint.textContent = message;
        hint.hidden = false;
        clearTimeout(hintTimer);
        hintTimer = setTimeout(() => { hint.hidden = true; }, 6000);
      }
      const TEXT_FILE = "./comunicado.txt";
      let paragraphs = [];
      let textLoaded = false;
      function setControlsEnabled(enabled){
        [pauseBtn, restartBtn, nextBtn].forEach(button => {
          button.disabled = !enabled;
        });
      }
      async function loadText(){
        setControlsEnabled(false);
        lectureText.textContent = "Cargando comunicado.txt…";
        lectureText.setAttribute("aria-busy", "true");
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 20000);
        try{
          const response = await fetch(TEXT_FILE, {
            signal:controller.signal,
            cache:"no-store"
          });
          if(!response.ok){
            throw new Error(response.status === 404
              ? "No se encontró comunicado.txt. Colócalo en la misma carpeta que esta página."
              : "No se pudo cargar comunicado.txt (HTTP " + response.status + ").");
          }
          if(/text\/html/i.test(response.headers.get("content-type") || "")){
            throw new Error("Se recibió una página HTML en lugar de comunicado.txt. Revisa la ubicación del archivo.");
          }
          const text = (await response.text()).replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
          paragraphs = text.trim().split(/\n\s*\n/).map(part => part.trim()).filter(Boolean);
          if(!paragraphs.length) throw new Error("comunicado.txt está vacío.");
          textLoaded = true;
          renderText();
          updateProgress(0);
          setControlsEnabled(speechAvailable);
          if(!speechAvailable){
            showHint("La lectura en voz alta no está disponible en este navegador.");
          }else if(!isIOS){
            speakParagraph(0);
          }
        }catch(error){
          textLoaded = false;
          paragraphs = [];
          lectureText.textContent = error.name === "AbortError"
            ? "La carga tardó demasiado. Revisa tu conexión y recarga la página."
            : error instanceof TypeError
              ? "No se pudo cargar comunicado.txt. Abre el lector desde GitHub Pages o un servidor web y revisa tu conexión."
              : error.message;
        }finally{
          clearTimeout(timeout);
          lectureText.setAttribute("aria-busy", "false");
        }
      }
      let currentParagraph = 0;
      let utterance = null;
      let stopped = false;
      let isPaused = false;
      let currentCharacter = 0;
      let speechRun = 0;
      let titlePauseTimer = null;
      function setPauseIcon(paused){
        pauseBtn.innerHTML = paused
          ? '<i aria-hidden="true" class="fa-solid fa-play" style="color: rgb(255, 255, 255);"></i>'
          : '<i aria-hidden="true" class="fa-solid fa-pause" style="color: rgb(255, 255, 255);"></i>';
        pauseBtn.setAttribute("aria-label", paused ? "Play" : "Pausar");
      }
      function cancelTitlePause(){
        if(titlePauseTimer !== null){
          clearTimeout(titlePauseTimer);
          titlePauseTimer = null;
        }
      }
      function renderText(){
        lectureText.replaceChildren();
        paragraphs.forEach((text, paragraphIndex) => {
          const paragraph = document.createElement("p");
          paragraph.className = "paragraph";
          paragraph.dataset.paragraph = paragraphIndex;
          const parts = text.match(/\S+|\s+/g) || [];
          let position = 0;
          parts.forEach(part => {
            if(/\s+/.test(part)){
              paragraph.appendChild(document.createTextNode(part));
            }else{
              const word = document.createElement("span");
              word.className = "word";
              word.dataset.start = position;
              word.dataset.end = position + part.length;
              word.textContent = part;
              paragraph.appendChild(word);
            }
            position += part.length;
          });
          lectureText.appendChild(paragraph);
        });
      }
      function clearHighlight(){
        document.querySelectorAll(".word.highlight")
          .forEach(word => word.classList.remove("highlight"));
      }
      function updateProgress(index){
        const completed = Math.min(Math.max(index, 0), paragraphs.length);
        const percent = paragraphs.length ? (completed / paragraphs.length) * 100 : 0;
        progressFill.style.width = `${percent}%`;
      }
      function isNumberedTitle(text){
        return /^\s*\d+\s*(?:[.):]\s*|-\s+|\n)/.test(text);
      }
      function findNextNumberedTitle(fromIndex){
        return paragraphs.findIndex((text, index) =>
          index > fromIndex && isNumberedTitle(text)
        );
      }
      function highlightWord(paragraphIndex, characterIndex){
        clearHighlight();
        const words = [...document.querySelectorAll(
          `.paragraph[data-paragraph="${paragraphIndex}"] .word`
        )];
        const word = words.find(item =>
          characterIndex >= Number(item.dataset.start) &&
          characterIndex < Number(item.dataset.end)
        );
        if(word){
          word.classList.add("highlight");
          word.scrollIntoView({block:"center", behavior:"smooth"});
        }
      }
      function speakParagraph(index, startAt = 0){
        if(!speechAvailable || !textLoaded) return;
        cancelTitlePause();
        if(index < 0 || index >= paragraphs.length){
          clearHighlight();
          updateProgress(paragraphs.length);
          readingActive = false;
          isPaused = false;
          currentParagraph = 0;
          currentCharacter = 0;
          setPauseIcon(true);
          return;
        }
        const run = ++speechRun;
        speechSynthesis.cancel();
        currentParagraph = index;
        updateProgress(index);
        currentCharacter = startAt;
        stopped = false;
        readingActive = true;
        isPaused = false;
        utterance = new SpeechSynthesisUtterance(paragraphs[index].slice(startAt));
        utterance.lang = "es-US";
        const voices = speechSynthesis.getVoices();
        const spanishVoice = voices.find(voice => voice.lang === "es-US") ||
          voices.find(voice => /^es(?:-|_)/i.test(voice.lang));
        if(spanishVoice) utterance.voice = spanishVoice;
        utterance.rate = 0.95;
        utterance.onboundary = event => {
          if(run !== speechRun || stopped || isPaused) return;
          if(event.name === "word"){
            currentCharacter = startAt + event.charIndex;
            highlightWord(index, currentCharacter);
          }
        };
        utterance.onend = () => {
          if(run !== speechRun || stopped || isPaused) return;
          const nextIndex = index + 1;
          if(nextIndex < paragraphs.length && isNumberedTitle(paragraphs[nextIndex])){
            clearHighlight();
            currentParagraph = nextIndex;
            currentCharacter = 0;
            titlePauseTimer = setTimeout(() => {
              titlePauseTimer = null;
              if(run !== speechRun || stopped || isPaused) return;
              speakParagraph(nextIndex);
            }, 3000);
          }else{
            speakParagraph(nextIndex);
          }
        };
        utterance.onerror = () => {
          if(run !== speechRun) return;
          readingActive = false;
          isPaused = true;
          setPauseIcon(true);
          showHint("Toca Play para iniciar o reanudar la lectura.");
        };
        setPauseIcon(false);
        speechSynthesis.speak(utterance);
      }
      pauseBtn.onclick = () => {
        if(!speechAvailable || !textLoaded) return;
        if(isPaused || !readingActive){
          speakParagraph(currentParagraph, currentCharacter);
        }else{
          isPaused = true;
          readingActive = false;
          stopped = true;
          speechRun++;
          cancelTitlePause();
          speechSynthesis.cancel();
          setPauseIcon(true);
        }
      };
      restartBtn.onclick = () => {
        speakParagraph(Math.max(0, currentParagraph - 1));
      };
      nextBtn.onclick = () => {
        const target = findNextNumberedTitle(currentParagraph);
        if(target !== -1) speakParagraph(target);
      };
      function fullscreenHint(){
        if(navigator.standalone || window.matchMedia("(display-mode: standalone)").matches) return;
        showHint(isIOS
          ? "Para una vista sin barras, abre esta página en Safari y usa Compartir → Agregar a pantalla de inicio."
          : "La pantalla completa no está disponible en este navegador.");
      }
      async function toggleFullscreen(){
        const fullscreenElement =
          document.fullscreenElement || document.webkitFullscreenElement;
        try{
          if(fullscreenElement){
            if(document.exitFullscreen){
              await document.exitFullscreen();
            }else if(document.webkitExitFullscreen){
              document.webkitExitFullscreen();
            }
          }else{
            const page = document.documentElement;
            if(page.requestFullscreen){
              await page.requestFullscreen();
            }else if(page.webkitRequestFullscreen){
              await page.webkitRequestFullscreen();
            }else{
              fullscreenHint();
            }
          }
        }catch(error){ fullscreenHint(); }
      }
      document.addEventListener("click", event => {
        if(event.target.closest("button")) return;
        toggleFullscreen();
      });
      updateProgress(0);
      setPauseIcon(true);
      loadText();
    </script>
  </body>
</html>
